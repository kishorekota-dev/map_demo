name: CI

# Test gate for the POC Banking Chat platform. Runs each service's jest/vitest
# suite — including the cross-service contract tests (tool-name resolution and
# intent-vocabulary parity) and the determinism regression tests — so a broken
# contract (a tool rename, a dead prompt, a non-zero default temperature) fails
# the build instead of shipping silently.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service-tests:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-orchestrator
          - nlu-service
          - mcp-service
          - chat-backend
          - api-gateway
          - banking-service
          - agent-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: services/${{ matrix.service }}
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        # --passWithNoTests keeps services that have not yet added specs green,
        # while any service that DOES have specs enforces them.
        run: npx jest --ci --passWithNoTests

  frontend-tests:
    name: test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Run tests
        working-directory: services/frontend
        run: npx vitest run --passWithNoTests
      - name: Build and typecheck
        working-directory: services/frontend
        run: npm run build

  control-plane-postgres:
    name: servicing PostgreSQL reliability
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: control_plane_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: control-plane-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gateway dependencies
        working-directory: services/api-gateway
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Verify persistent configuration and replica isolation
        working-directory: services/api-gateway
        env:
          TEST_CONTROL_PLANE_DATABASE_URL: postgres://postgres:control-plane-ci@127.0.0.1:5432/control_plane_test
          TEST_OPERATIONS_DATABASE_URL: postgres://postgres:control-plane-ci@127.0.0.1:5432/control_plane_test
        run: npx jest --ci --runInBand control-plane/__tests__ operations/__tests__ platform/__tests__ quality/__tests__
      - name: Install runtime dependencies
        run: |
          npm ci --prefix services/ai-orchestrator --workspaces=false --no-audit --no-fund
          npm ci --prefix services/chat-backend --workspaces=false --no-audit --no-fund
          npm ci --prefix services/banking-service --workspaces=false --no-audit --no-fund
      - name: Verify distributed runtime and channel recovery
        env:
          RUNTIME_TEST_DATABASE_URL: postgres://postgres:control-plane-ci@127.0.0.1:5432/control_plane_test
        run: |
          npm test --prefix services/ai-orchestrator -- --ci --runInBand
          npm test --prefix services/chat-backend -- --ci --runInBand
      - name: Verify explicit migrations and production deployment configuration
        env:
          DEPLOYMENT_TEST_DATABASE_URL: postgres://postgres:control-plane-ci@127.0.0.1:5432/control_plane_test
        run: node --test deployment-scripts/__tests__/*.test.cjs
      - name: Create isolated banking test database
        working-directory: services/api-gateway
        run: node -e 'const {Client}=require("pg");(async()=>{const c=new Client({connectionString:"postgres://postgres:control-plane-ci@127.0.0.1:5432/control_plane_test"});await c.connect();await c.query("CREATE DATABASE banking_test");await c.end();})().catch(()=>process.exit(1))'
      - name: Verify banking migration, seed and administrator bootstrap safety
        working-directory: services/banking-service
        env:
          BANKING_TEST_DATABASE_URL: postgres://postgres:control-plane-ci@127.0.0.1:5432/banking_test
        run: npm test -- --ci --runInBand
      - name: Verify current documentation links
        run: node deployment-scripts/check-doc-links.cjs

  dependency-audit:
    name: audit workspace and frontend runtime locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit workspace dependencies including build/test tools
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit locked frontend runtime server
        run: npm audit --prefix services/frontend/runtime --workspaces=false --package-lock-only --omit=dev --audit-level=high
      - name: Audit nested banking database tools
        run: npm audit --prefix services/banking-service/database --workspaces=false --package-lock-only --omit=dev --audit-level=high
