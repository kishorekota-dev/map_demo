openapi: 3.0.3
info:
  title: POC NLP Compatibility API
  description: |
    Legacy NLP endpoints are now served by the NLU service for backward compatibility.
    This surface preserves older `/api/process` and `/api/nlp/process` integrations while
    routing all processing through the current NLU deployment.

    ## Compatibility behavior
    - `/api/process`, `/api/nlp/process`, and `/api/nlu/process` resolve to the same handler
    - Banking entities, keywords, and sentiment are derived locally when needed
    - Canonical NLU workflows remain documented in `poc-nlu-service.swagger.yaml`
  version: 1.0.0
  contact:
    name: POC Banking Team
    email: poc-banking@company.com

servers:
  - url: http://localhost:3003
    description: Development server
  - url: https://nlu-service.poc-banking.com
    description: Production server

tags:
  - name: Health
    description: Service health and readiness
  - name: Compatibility
    description: Legacy NLP-compatible text analysis endpoints hosted by the NLU service

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/process:
    post:
      tags: [Compatibility]
      summary: Process text through the legacy NLP compatibility endpoint
      description: Accepts legacy NLP request payloads and returns normalized text-analysis output from the NLU service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextProcessingRequest'
      responses:
        '200':
          description: Text processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nlp/process:
    post:
      tags: [Compatibility]
      summary: Process text through the historical NLP route namespace
      description: Backward-compatible alias for `/api/process`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextProcessingRequest'
      responses:
        '200':
          description: Text processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nlu/process:
    post:
      tags: [Compatibility]
      summary: Process text through the NLU compatibility namespace
      description: NLU-native alias that exposes the same compatibility response contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextProcessingRequest'
      responses:
        '200':
          description: Text processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: nlu-service
        timestamp:
          type: string
          format: date-time
        compatibility:
          type: object
          properties:
            legacyNlpRoutes:
              type: boolean
              example: true
            canonicalPort:
              type: integer
              example: 3003

    TextProcessingRequest:
      type: object
      properties:
        message:
          type: string
          description: Preferred field for chat text
          example: Transfer 250 dollars to my savings account tomorrow.
        text:
          type: string
          description: Legacy field accepted by older NLP clients
          example: Transfer 250 dollars to my savings account tomorrow.
        sessionId:
          type: string
          example: session-123
        context:
          type: object
          additionalProperties: true
      anyOf:
        - required: [message]
        - required: [text]

    CompatibilityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        service:
          type: string
          example: nlu-service
        legacyEndpoint:
          type: boolean
          example: true
        processingMode:
          type: string
          example: compatibility
        intent:
          type: string
          example: transfer_money
        confidence:
          type: number
          format: float
          example: 0.93
        sentiment:
          type: object
          properties:
            label:
              type: string
              example: neutral
            score:
              type: number
              format: float
              example: 0.12
        keywords:
          type: array
          items:
            type: string
          example: [transfer, savings, tomorrow]
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        metadata:
          type: object
          properties:
            sourceRoute:
              type: string
              example: /api/nlp/process
            canonicalServiceUrl:
              type: string
              example: http://localhost:3003

    Entity:
      type: object
      properties:
        type:
          type: string
          example: amount
        value:
          type: string
          example: '250'
        confidence:
          type: number
          format: float
          example: 0.98

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Validation failed
        details:
          type: string
          example: Either `message` or `text` is required.

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
