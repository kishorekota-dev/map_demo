services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: poc_banking
      POSTGRES_USER: poc_user
      POSTGRES_PASSWORD: poc_password
      POSTGRES_MULTIPLE_DATABASES: poc_banking,poc_chat,ai_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh:ro
      - ../scripts/init-ai-orchestrator-db.sql:/docker-entrypoint-initdb.d/02-init-ai-orchestrator-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc_user -d poc_banking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlu-service:
    build:
      context: ../services/nlu-service
    environment:
      NODE_ENV: production
      NLU_SERVICE_PORT: 3003
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:8081
      BANKING_SERVICE_URL: http://banking-service:3005
      NLP_SERVICE_URL: http://nlu-service:3003
      MCP_SERVICE_URL: http://mcp-service:3004
      DIALOGFLOW_ENABLED: ${DIALOGFLOW_ENABLED:-false}
      DIALOGFLOW_PROJECT_ID: ${DIALOGFLOW_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/dialogflow-key.json
    ports:
      - "3003:3003"
    volumes:
      - ../services/nlu-service/credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  banking-service:
    build:
      context: ../services/banking-service
    environment:
      DEPLOYMENT_TENANT_ID: ${DEPLOYMENT_TENANT_ID:-default-enterprise}
      NODE_ENV: production
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: poc_banking
      DB_USER: poc_user
      DB_PASSWORD: poc_password
      DATABASE_URL: postgresql://poc_user:poc_password@postgres:5432/poc_banking
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8081
      NLU_SERVICE_URL: http://nlu-service:3003
      NLP_SERVICE_URL: http://nlu-service:3003
      MCP_SERVICE_URL: http://mcp-service:3004
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  mcp-service:
    build:
      context: ../services/mcp-service
    environment:
      NODE_ENV: production
      MCP_SERVICE_PORT: 3004
      BANKING_SERVICE_URL: http://banking-service:3005
      NLP_SERVICE_URL: http://nlu-service:3003
      NLU_SERVICE_URL: http://nlu-service:3003
    ports:
      - "3004:3004"
    depends_on:
      banking-service:
        condition: service_healthy
      nlu-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ../services/ai-orchestrator
    environment:
      DEPLOYMENT_TENANT_ID: ${DEPLOYMENT_TENANT_ID:-default-enterprise}
      CONTROL_PLANE_ENABLED: "${CONTROL_PLANE_ENABLED:-true}"
      CONTROL_PLANE_URL: http://api-gateway:3001/api/control-plane
      SERVICING_SERVICE_TOKEN: "${SERVICING_SERVICE_TOKEN:-}"
      OPERATIONS_URL: http://api-gateway:3001/api/operations
      WORKFLOW_DURABLE_EXECUTION: "true"
      WORKFLOW_DATABASE_URL: ${WORKFLOW_DATABASE_URL:-}
      WORKFLOW_SCHEMA_AUTO_MIGRATE: "${WORKFLOW_SCHEMA_AUTO_MIGRATE:-true}"
      LLM_PROVIDERS_FILE: ${LLM_PROVIDERS_FILE-config/llm-providers.example.json}
      LLM_PROVIDERS_JSON: ${LLM_PROVIDERS_JSON:-}
      LLM_OLLAMA_BASE_URL: ${LLM_OLLAMA_BASE_URL:-http://mac-studio.local:11434}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_GEMINI_API_KEY: ${LLM_GEMINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      RECOGNITION_PROVIDER_URL: ${RECOGNITION_PROVIDER_URL:-}
      RECOGNITION_PROVIDER_TOKEN: ${RECOGNITION_PROVIDER_TOKEN:-}
      CONTROL_PLANE_ENVIRONMENT: ${CONTROL_PLANE_ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_orchestrator
      DB_USER: poc_user
      DB_PASSWORD: poc_password
      OPENAI_ENABLED: "${OPENAI_ENABLED:-false}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      SLM_ENABLED: "${SLM_ENABLED:-false}"
      SLM_BASE_URL: ${SLM_BASE_URL:-}
      SLM_API_KEY: ${SLM_API_KEY:-}
      MCP_SERVICE_URL: http://mcp-service:3004
      MCP_TRANSPORT: http
      BANKING_SERVICE_URL: http://banking-service:3005
      NLU_SERVICE_URL: http://nlu-service:3003
      CHAT_BACKEND_URL: http://chat-backend:3006
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3007/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  chat-backend:
    build:
      context: ../services/chat-backend
    environment:
      DEPLOYMENT_TENANT_ID: ${DEPLOYMENT_TENANT_ID:-default-enterprise}
      CONTROL_PLANE_ENABLED: "${CONTROL_PLANE_ENABLED:-true}"
      CONTROL_PLANE_URL: http://api-gateway:3001/api/control-plane
      SERVICING_SERVICE_TOKEN: "${SERVICING_SERVICE_TOKEN:-}"
      HANDOFF_STORAGE: postgres
      HANDOFF_DATABASE_URL: ${HANDOFF_DATABASE_URL:-}
      HANDOFF_SCHEMA_AUTO_MIGRATE: "${HANDOFF_SCHEMA_AUTO_MIGRATE:-true}"
      NODE_ENV: production
      PORT: 3006
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: poc_chat
      DB_USER: poc_user
      DB_PASSWORD: poc_password
      DB_SSL: "false"
      CHAT_PERSISTENCE_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      API_GATEWAY_URL: http://api-gateway:3001
      BANKING_SERVICE_URL: http://banking-service:3005
      NLP_SERVICE_URL: http://nlu-service:3003
      NLU_SERVICE_URL: http://nlu-service:3003
      MCP_SERVICE_URL: http://mcp-service:3004
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:3007
      REDIS_URL: redis://redis:6379
      AGENT_FALLBACK_ENABLED: "true"
      AGENT_RESPONSE_TIMEOUT: ${AGENT_RESPONSE_TIMEOUT:-400000}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      banking-service:
        condition: service_healthy
      nlu-service:
        condition: service_healthy
      mcp-service:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  api-gateway:
    build:
      context: ../services/api-gateway
    environment:
      DEPLOYMENT_TENANT_ID: ${DEPLOYMENT_TENANT_ID:-default-enterprise}
      CONTROL_PLANE_ENABLED: "${CONTROL_PLANE_ENABLED:-true}"
      CONTROL_PLANE_URL: http://api-gateway:3001/api/control-plane
      SERVICING_SERVICE_TOKEN: "${SERVICING_SERVICE_TOKEN:-}"
      OPERATIONS_DATABASE_URL: ${OPERATIONS_DATABASE_URL:-postgresql://poc_user:poc_password@postgres:5432/poc_banking}
      OPERATIONS_MANAGE_SCHEMA: "${OPERATIONS_MANAGE_SCHEMA:-true}"
      CONTROL_PLANE_MANAGE_SCHEMA: "${CONTROL_PLANE_MANAGE_SCHEMA:-true}"
      AUDIT_SIGNING_KEY_FILE: ${AUDIT_SIGNING_KEY_FILE:-}
      AUDIT_ACTOR_HASH_KEY: ${AUDIT_ACTOR_HASH_KEY:-}
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-90}
      FULFILLMENT_WORKER_ENABLED: "true"
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      CONNECTOR_PRIVATE_HOSTS: ${CONNECTOR_PRIVATE_HOSTS:-}
      CONNECTOR_SECRET_ROOT: ${CONNECTOR_SECRET_ROOT:-}
      CASE_CONNECTOR_ID: ${CASE_CONNECTOR_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_CLIENT_SECRET_REF: ${OIDC_CLIENT_SECRET_REF:-}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:-postgresql://poc_user:poc_password@postgres:5432/poc_banking}
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      BANKING_SERVICE_URL: http://banking-service:3005
      NLP_SERVICE_URL: http://nlu-service:3003
      NLU_SERVICE_URL: http://nlu-service:3003
      MCP_SERVICE_URL: http://mcp-service:3004
      CHAT_BACKEND_URL: http://chat-backend:3006
      SERVICING_REQUEST_TIMEOUT_MS: ${SERVICING_REQUEST_TIMEOUT_MS:-410000}
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:3007
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      banking-service:
        condition: service_healthy
      nlu-service:
        condition: service_healthy
      mcp-service:
        condition: service_healthy
      chat-backend:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  agent-ui:
    build:
      context: ../services/agent-ui
    environment:
      NODE_ENV: production
      PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_GATEWAY_URL: http://api-gateway:3001
      CHAT_BACKEND_URL: http://chat-backend:3006
      BANKING_SERVICE_URL: http://banking-service:3005
      NLU_SERVICE_URL: http://nlu-service:3003
      MCP_SERVICE_URL: http://mcp-service:3004
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      CORS_ORIGIN: http://localhost:8081,http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      chat-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../services/frontend
      target: production
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
        VITE_BANKING_SERVICE_URL: http://localhost:3005/api/v1
        VITE_APP_NAME: POC Banking Chat
        VITE_APP_VERSION: 2.0.0
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
      banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
